name: AutoServe Master Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ "master", "main", "release/*", "feature/*" ]
  pull_request:
    branches: [ "master", "main", "release/*" ]

jobs:
  backend-build-test:
    name: Backend Build & Verification
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: autoservetest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Validate Maven Wrapper & Dependencies
        run: cd backend && ./mvnw dependency:resolve -B

      - name: Run Backend Integration & Security Tests
        run: cd backend && ./mvnw test -B
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Package Production JAR
        run: cd backend && ./mvnw clean package -DskipTests -B

  frontend-build-test:
    name: Frontend Quality & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Run Vitest Unit & Integration Test Suite
        run: cd frontend && npm run test -- --run

      - name: Verify TypeScript & Build Bundle
        run: cd frontend && npm run build

  docker-build-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: autoserve-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: autoserve-frontend:ci
