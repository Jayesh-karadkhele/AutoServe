server:
  port: 8081

spring:
  jpa:
    # TEMPORARY DEVELOPMENT SETTING: Will be replaced by Flyway migrations in database phase
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    root: INFO
    com.car_backend: DEBUG
    org.springframework.security: INFO

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
