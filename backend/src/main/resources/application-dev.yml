server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/autoserve_flyway_dev?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:autoserve_app}
    password: ${DB_PASSWORD:autoserve_pass}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    root: INFO
    com.car_backend: DEBUG
    org.springframework.security: INFO

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
