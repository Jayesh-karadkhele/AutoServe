spring:
  application:
    name: autoserve
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/autoserve_v101?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Custom Application Integration Properties (Configured via Environment Variables)
jwt:
  secret: ${JWT_SECRET:AutoServeDefaultSuperSecretJWTKeyWhichIs32BytesLongMinimumForHmacSha256!}
  expiration: ${JWT_EXPIRATION:86400000}

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:}
    secret: ${RAZORPAY_KEY_SECRET:}

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:}
  api_key: ${CLOUDINARY_API_KEY:}
  api_secret: ${CLOUDINARY_API_SECRET:}

app:
  auth:
    jwt-access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRATION:604800000}
    session-expiration-ms: ${AUTH_SESSION_EXPIRATION:604800000}
    cookie-name: ${REFRESH_COOKIE_NAME:AUTOSERVE_REFRESH}
    cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    cookie-path: /api/auth
    cookie-domain: ${REFRESH_COOKIE_DOMAIN:}
    client-header-name: X-AutoServe-Client
    client-header-value: web
    cleanup:
      enabled: ${APP_AUTH_CLEANUP_ENABLED:true}
      cron: ${APP_AUTH_CLEANUP_CRON:0 0 3 * * *}
  bootstrap:
    admin:
      enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
  mail:
    from: ${MAIL_FROM:noreply@autoserve.com}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

invoice:
  tax:
    percentage: ${INVOICE_TAX_PERCENTAGE:18.0}
