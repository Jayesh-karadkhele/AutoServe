server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

spring:
  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: WARN
    com.car_backend: INFO
    org.springframework.security: WARN
    org.hibernate: WARN

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
